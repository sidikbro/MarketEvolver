[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-evolver"
version = "0.7.0"
description = "Governed, point-in-time-correct multi-agent market research laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
market-evolver = "market_evolver.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgres: optional tests requiring a dedicated live PostgreSQL database",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["market_evolver"]

[tool.ruff]
target-version = "py311"
line-length = 100
