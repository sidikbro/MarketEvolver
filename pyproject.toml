[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "market-evolver"
version = "0.23.0"
description = "Governed, point-in-time-correct multi-agent market research laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "duckdb>=1.2,<2",
    "pytz>=2024,<2027",
]

[project.scripts]
market-evolver = "market_evolver.cli:main"

[project.optional-dependencies]
telegram = ["telethon>=1.40,<2"]
dev = ["pytest>=8", "pytest-cov>=6", "mypy>=1.11", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: deterministic unit tests without external services",
    "postgres: optional tests requiring a dedicated live PostgreSQL database",
    "integration: deterministic cross-component integration tests",
    "live: tests requiring a live external data source",
    "slow: deterministic tests with substantial runtime",
    "external_provider: tests requiring an explicitly enabled model provider",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["market_evolver"]

[tool.ruff]
target-version = "py311"
line-length = 100
